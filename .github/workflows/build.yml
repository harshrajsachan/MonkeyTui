name: Build MonkeyTUI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn --batch-mode clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: monkeytui-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
